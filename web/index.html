<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171613" />
    <title>PhotoCoach · 摄影助手</title>
    <link rel="stylesheet" href="/styles.css?v=4" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="brand-mark"><span>PC</span></div>
        <div class="brand-copy"><strong>PhotoCoach</strong><span>摄影灵感与分析</span></div>
        <div class="sidebar-divider"></div>
        <div class="sidebar-section">
          <div class="section-heading"><span class="section-label">当前会话</span><button id="new-session" class="new-session-button" type="button">＋ 新建</button></div>
          <label class="session-input"><span>SESSION</span><input id="session-id" type="text" autocomplete="off" /></label>
          <div id="session-list" class="session-list" aria-label="历史会话"></div>
        </div>
        <div class="sidebar-section capabilities">
          <span class="section-label">可用能力</span>
          <span class="capability"><i></i>构图分析</span>
          <span class="capability"><i></i>光线与曝光</span>
          <span class="capability"><i></i>拍摄建议</span>
          <span class="capability"><i></i>多轮图片对话</span>
        </div>
        <div class="sidebar-footer"><span class="online-dot"></span><span>Agents SDK 在线</span></div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div><span class="topbar-kicker">PHOTO CONVERSATION</span><h1>和你的照片聊聊</h1></div>
          <div class="model-pill"><span></span> GLM Vision · DeepSeek</div>
        </header>

        <section id="messages" class="messages" aria-live="polite">
          <div class="welcome-card">
            <div class="welcome-icon">✦</div>
            <div><p class="welcome-eyebrow">HELLO, PHOTOGRAPHER</p><h2>把一张照片，变成一次学习。</h2><p>上传照片，或者直接问我关于构图、光线、曝光和拍摄计划的问题。</p></div>
          </div>
          <div class="prompt-grid">
            <button class="prompt-card" data-prompt="请分析这张照片的构图、光线和曝光。"><span class="prompt-symbol">◌</span><span>全面分析一张照片</span><small>构图 · 光线 · 曝光</small></button>
            <button class="prompt-card" data-prompt="手机怎么拍出电影感？"><span class="prompt-symbol">↗</span><span>获得拍摄灵感</span><small>设备 · 场景 · 参数</small></button>
            <button class="prompt-card" data-prompt="这张照片最值得改进的地方是什么？"><span class="prompt-symbol">◎</span><span>找到一处突破口</span><small>优先级 · 可执行建议</small></button>
          </div>
        </section>

        <form id="chat-form" class="composer">
          <div id="attachment-preview" class="attachment-preview" hidden><img id="preview-image" alt="待发送图片预览" /><div class="preview-meta"><span id="file-name"></span><small>图片会作为本轮对话的上下文</small></div><button id="remove-image" type="button" class="icon-button" aria-label="移除图片">×</button></div>
          <textarea id="message" rows="2" placeholder="问问你的照片，或者说说你想拍什么……"></textarea>
          <div class="composer-footer"><div class="composer-tools"><label class="attach-button" title="添加图片"><span>＋</span> 添加照片<input id="image" type="file" accept="image/jpeg,image/png,image/webp" /></label><span id="file-name-inline" class="file-name-inline">支持 JPG、PNG、WEBP · 最大 10MB</span></div><button id="send" class="send-button" type="submit"><span>发送</span><b>↗</b></button></div>
        </form>
        <p class="composer-hint">PhotoCoach 可能会犯错，请把建议当作摄影参考。</p>
      </main>
    </div>
    <script src="/app.js?v=4"></script>
  </body>
</html>
