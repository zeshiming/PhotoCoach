[project]
name = "photo-coach"
version = "0.1.0"
description = "A production-oriented photography agent prototype"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "openai-agents>=0.1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
